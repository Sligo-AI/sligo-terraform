managedSslCertificate:
  enabled: true
  name: sligo-managed-cert-app
  domains: []

# GKE ManagedCertificate allows one domain per object on some clusters.
# Extra certs are attached on the Ingress via a comma-separated annotation.
extraManagedSslCertificates: []

# Frontend is probed at /api/health. The public API backend is probed at /health.
# Port is omitted so GKE probes the NodePort. These clusters do not use NEGs.
backendConfigs:
  - name: sligo-app-backendconfig
    timeoutSec: 1800
    healthCheck:
      requestPath: /api/health
  - name: sligo-api-backendconfig
    timeoutSec: 1800
    healthCheck:
      requestPath: /health

# Points the GCE Ingress at an existing Compute SSL policy. The policy is created
# by the Terraform module (or supplied by name). This chart does not create it.
frontendConfig:
  enabled: false
  name: sligo-frontend-config
  sslPolicy: ""
