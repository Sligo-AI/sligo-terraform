{{- if .Values.managedSslCertificate.enabled }}
apiVersion: networking.gke.io/v1beta1
kind: ManagedCertificate
metadata:
  name: {{ .Values.managedSslCertificate.name }}
spec:
  domains:
{{- range .Values.managedSslCertificate.domains }}
    - {{ . | quote }}
{{- end }}
{{- end }}
{{- range .Values.extraManagedSslCertificates }}
---
apiVersion: networking.gke.io/v1beta1
kind: ManagedCertificate
metadata:
  name: {{ .name }}
spec:
  domains:
{{- range .domains }}
    - {{ . | quote }}
{{- end }}
{{- end }}
