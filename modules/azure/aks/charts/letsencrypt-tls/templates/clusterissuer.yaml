{{- if .Values.enabled }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.issuerName }}
spec:
  acme:
    email: {{ required "letsencrypt email is required" .Values.email | quote }}
    server: {{ .Values.server | quote }}
    privateKeySecretRef:
      name: {{ .Values.privateKeySecretName }}
    solvers:
      - http01:
          ingress:
            class: {{ .Values.ingressClass | quote }}
{{- end }}
